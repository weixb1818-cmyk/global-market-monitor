name: Update daily market snapshot
run-name: ${{ inputs.origin || github.event_name }} | ${{ inputs.dispatch_id || github.event.schedule || 'manual' }}
on:
  schedule:
    - cron: '15 0 * * *'
    - cron: '45 0 * * *'
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      origin:
        description: Trigger source (never changes the actual GitHub event)
        type: choice
        options: [manual, host_cron, host_timer_test]
        default: manual
      planned_at:
        description: Original planned time with timezone
        type: string
      requested_at:
        description: Host invocation time with timezone
        type: string
      dispatch_id:
        description: Host audit correlation identifier
        type: string
      force:
        description: Explicit verification bypass of daily health guard
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Deduplicate all automatic routes after a healthy publication
        id: gate
        run: python3 scripts/schedule_audit.py --gate
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER_ORIGIN: ${{ inputs.origin || (github.event_name == 'schedule' && 'github_schedule') || 'manual' }}
          TRIGGER_FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      data_outcome: ${{ steps.update.outcome }}
      snapshot_at: ${{ steps.package.outputs.snapshot_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate calculation and rendering
        run: |
          python -m unittest discover -s tests -q
          node --check app.js
          node tests/test_ui.cjs
      - name: Fetch real market data
        id: update
        continue-on-error: true
        run: python scripts/update_data.py
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER_ORIGIN: ${{ inputs.origin || (github.event_name == 'schedule' && 'github_schedule') || 'manual' }}
          TRIGGER_PLANNED_AT: ${{ inputs.planned_at }}
          TRIGGER_REQUESTED_AT: ${{ inputs.requested_at }}
          TRIGGER_DISPATCH_ID: ${{ inputs.dispatch_id }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BARCHART_API_KEY: ${{ secrets.BARCHART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKET_DATA_DXY_URL: ${{ secrets.MARKET_DATA_DXY_URL }}
          MARKET_DATA_GOLD_URL: ${{ secrets.MARKET_DATA_GOLD_URL }}
          MARKET_DATA_WTI_URL: ${{ secrets.MARKET_DATA_WTI_URL }}
          MARKET_DATA_COPPER_URL: ${{ secrets.MARKET_DATA_COPPER_URL }}
      - name: Audit actual schedule arrival and completion times
        continue-on-error: true
        run: python scripts/schedule_audit.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Review fixed-rule historical evidence
        continue-on-error: true
        run: |
          python scripts/analyze_macro.py
          python scripts/build_quality_report.py
      - name: Retain source and generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-and-generation-evidence
          path: |
            data/source_evidence.json
            data/raw/
            verification/schedule-10-days.json
            verification/macro-analysis.json
      - name: Publish updated data and failure status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json data/history.json data/last_attempt.json data/source_evidence.json
          if [ -d data/raw ]; then git add data/raw; fi
          if [ -f verification/schedule-10-days.json ]; then git add verification/schedule-10-days.json; fi
          if [ -f verification/macro-analysis.json ]; then git add verification/macro-analysis.json; fi
          if [ -f docs/DATA_QUALITY_REPORT.md ]; then git add docs/DATA_QUALITY_REPORT.md; fi
          git diff --cached --quiet || (git commit -m 'Update market data' && git push)
      - name: Prepare static site
        id: package
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/snapshot.json data/last_attempt.json data/source_research.json _site/data/
          if [ -f data/source_evidence.json ]; then cp data/source_evidence.json _site/data/; fi
          python -c 'import json,os; print("snapshot_at="+json.load(open("data/snapshot.json"))["generated_at"],file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Mark an actual deployment for downstream browser checks
        run: echo 'deployed' > deployed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-marker
          path: deployed.txt
      - name: Verify actual public publication and update trigger
        run: python scripts/verify_public.py
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_GENERATED_AT: ${{ needs.update.outputs.snapshot_at }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_SCHEDULE: ${{ github.event.schedule }}
          EXPECTED_ORIGIN: ${{ inputs.origin || (github.event_name == 'schedule' && 'github_schedule') || 'manual' }}
          EXPECTED_DISPATCH_ID: ${{ inputs.dispatch_id }}
          EXPECTED_PLANNED_AT: ${{ inputs.planned_at }}
          EXPECTED_DATA_OUTCOME: ${{ needs.update.outputs.data_outcome }}
      - name: Retain publication and trigger evidence
        uses: actions/upload-artifact@v4
        with:
          name: publication-evidence
          path: verification/publication.json
          if-no-files-found: error
      - name: Report total data failure after publishing retained snapshot
        if: needs.update.outputs.data_outcome == 'failure'
        run: exit 1
