name: Update daily market snapshot
on:
  schedule:
    - cron: '15 0 * * *'
    # Temporary genuine scheduler probe; remove after event=schedule is verified.
    - cron: '*/5 7-8 21 11 *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      data_outcome: ${{ steps.update.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate calculation and rendering
        run: |
          python -m unittest discover -s tests -q
          node --check app.js
          node tests/test_ui.cjs
      - name: Fetch real market data
        id: update
        continue-on-error: true
        run: python scripts/update_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKET_DATA_DXY_URL: ${{ secrets.MARKET_DATA_DXY_URL }}
          MARKET_DATA_GOLD_URL: ${{ secrets.MARKET_DATA_GOLD_URL }}
          MARKET_DATA_WTI_URL: ${{ secrets.MARKET_DATA_WTI_URL }}
          MARKET_DATA_COPPER_URL: ${{ secrets.MARKET_DATA_COPPER_URL }}
      - name: Publish updated data and failure status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json data/history.json data/last_attempt.json
          git diff --cached --quiet || (git commit -m 'Update market data' && git push)
      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/snapshot.json data/last_attempt.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report total data failure after publishing retained snapshot
        if: needs.update.outputs.data_outcome == 'failure'
        run: exit 1
