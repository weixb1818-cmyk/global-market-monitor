name: Independent public browser verification
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Update daily market snapshot']
    types: [completed]
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser
        run: |
          npm install --prefix /tmp/market-browser-qa playwright
          /tmp/market-browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Check the actual public site on desktop and mobile
        run: node tests/verify_live.cjs
        env:
          NODE_PATH: /tmp/market-browser-qa/node_modules
          DASHBOARD_URL: https://weixb1818-cmyk.github.io/global-market-monitor/
          EXPECTED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          EXPECTED_EVENT: ${{ github.event.workflow_run.event }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-verification
          path: verification/
